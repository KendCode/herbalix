<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada · Herbalix</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --forest: #2F4B3C;
        --forest-deep: #1E3329;
        --sage: #93AB94;
        --paper: #F3EEE3;
        --paper-warm: #EAE2D0;
        --ochre: #B98A2E;
        --root: #7C3F35;
        --ink: #2A2A24;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: 'Karla', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle at 15% 20%, rgba(147,171,148,0.18), transparent 40%),
          radial-gradient(circle at 85% 80%, rgba(185,138,46,0.12), transparent 45%);
        pointer-events: none;
      }

      .wrap {
        position: relative;
        max-width: 480px;
        width: 100%;
        text-align: center;
        z-index: 1;
      }

      .mark {
        width: 92px;
        height: 92px;
        margin: 0 auto 8px;
        color: var(--forest);
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-size: 11px;
        font-weight: 700;
        color: var(--ochre);
        margin: 18px 0 6px;
      }

      h1 {
        font-family: 'Fraunces', serif;
        font-weight: 300;
        font-style: italic;
        font-size: clamp(48px, 12vw, 76px);
        line-height: 1;
        color: var(--forest-deep);
        margin: 0 0 4px;
      }

      h2 {
        font-family: 'Fraunces', serif;
        font-weight: 500;
        font-size: clamp(20px, 4vw, 26px);
        color: var(--ink);
        margin: 0 0 16px;
      }

      p {
        font-size: 15px;
        line-height: 1.65;
        color: rgba(42,42,36,0.72);
        margin: 0 auto 32px;
        max-width: 360px;
      }

      .path {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 28px 0 32px;
        opacity: 0.55;
      }

      .path span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--sage);
      }

      .path span:nth-child(3) { background: var(--ochre); }
      .path span:nth-child(4) { opacity: 0.4; }
      .path span:nth-child(5) { opacity: 0.25; }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      a.btn {
        display: inline-block;
        text-decoration: none;
        font-family: 'Karla', sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 15px 28px;
        border-radius: 2px;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      a.btn:focus-visible {
        outline: 2px solid var(--forest);
        outline-offset: 3px;
      }

      a.btn.primary {
        background: var(--forest);
        color: var(--paper);
        box-shadow: 0 4px 14px rgba(47,75,60,0.25);
      }

      a.btn.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(47,75,60,0.32); }

      a.btn.secondary {
        background: transparent;
        color: var(--forest);
        border: 1.5px solid var(--sage);
      }

      a.btn.secondary:hover { background: rgba(147,171,148,0.12); }

      .foot {
        margin-top: 44px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(42,42,36,0.35);
      }

      @media (prefers-reduced-motion: no-preference) {
        .mark path { transition: stroke-dashoffset 1.1s ease-out; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M50 92C50 92 24 74 24 46C24 27 36 12 50 8C64 12 76 27 76 46C76 74 50 92 50 92Z" stroke="currentColor" stroke-width="2.2"/>
        <path d="M50 8V80" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 3"/>
        <path d="M50 30C50 30 38 32 34 42" stroke="currentColor" stroke-width="1.6"/>
        <path d="M50 48C50 48 64 50 68 60" stroke="currentColor" stroke-width="1.6"/>
        <path d="M50 66C50 66 40 68 37 76" stroke="currentColor" stroke-width="1.6"/>
      </svg>

      <p class="eyebrow">Herbalix &middot; Centro de Bienestar Integral</p>
      <h1>404</h1>
      <h2>Este sendero no llega a ningún lado.</h2>
      <p>
        La página que buscas se perdió entre las hierbas. Puede que la dirección
        haya cambiado o que el enlace ya no exista. Volvamos a un lugar conocido.
      </p>

      <div class="path" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="actions">
        <a class="btn primary" href="index.html">Volver al inicio</a>
        <!-- <a class="btn secondary" href="/contacto">Contactar</a> -->
      </div>

      <p class="foot">Medicina tradicional &amp; cosmética natural</p>
    </div>
  </body>
</html>
